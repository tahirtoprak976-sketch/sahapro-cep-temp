      - name: Verify installed v3.10.09 to assistant hub preservation
        run: |
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_schema7.py --source-root . --baseline-ref f54c0f5dd2c52978a3b01198684aecf4767f1591

      - name: Prove missing assistant hub on unchanged v3.10.09
        run: |
          set -euo pipefail
          baseline=$(mktemp -d /tmp/solo-hub110-baseline-XXXXXX)
          git -c safe.directory="$GITHUB_WORKSPACE" archive f54c0f5dd2c52978a3b01198684aecf4767f1591 | tar -x -C "$baseline"
          python3 -m http.server 8874 --bind 127.0.0.1 --directory "$baseline" > /tmp/solo-hub110-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$baseline"' EXIT
          python3 - <<'PYREADY'
          import time
          from urllib.request import urlopen
          for i in range(60):
              try:
                  with urlopen('http://localhost:8874/index.html',timeout=1)as r:assert r.status==200
                  break
              except OSError:
                  if i==59:raise
                  time.sleep(.2)
          PYREADY
          if /tmp/solo-e2e-venv/bin/python tools/e2e/assistant_hub110.py http://localhost:8874/ > /tmp/solo-hub110-baseline.log 2>&1; then
            echo 'Unchanged v109 unexpectedly exposes the executable assistant hub'
            exit 1

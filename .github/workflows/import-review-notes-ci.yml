name: SOLO data preservation validation

# This isolated validation job cannot deploy or change repository content.
on:
  push:
    branches:
      - dot/import-review-notes
      - dot/solo-simplification
      - dot/solo-finance-audit
      - dot/solo-dump-accounting
      - codex/historical-fuel-review
      - fix/redteam-three-findings
      - fix/solo-workflow-76
      - fix/solo-cari-vat-78
      - fix/solo-finance-audit-79
      - fix/solo-assistant-audit-80
      - fix/solo-assistant-files-81
      - fix/solo-assistant-review-82
      - feat/solo-hakedis-preparation-83
      - fix/solo-integrity-84
      - fix/solo-digital-slip-work-85
      - fix/solo-dump-card-merge-86
      - feat/solo-work-day-review-87
      - fix/solo-integrity-review-88
      - feat/solo-fleet-document-countdown-89
      - fix/solo-maintenance-expense-link-90

permissions:
  contents: read

concurrency:
  group: solo-data-preservation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact branch commit without saved credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the normal Linux browser test runtime
        id: runtime
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends chromium python3-venv fonts-liberation fonts-dejavu-core
          python3 -m venv /tmp/solo-e2e-venv
          /tmp/solo-e2e-venv/bin/python -m pip install --disable-pip-version-check playwright==1.62.0 reportlab==4.4.9 pypdf==6.10.0 Pillow==12.3.0
          node --version
          /usr/bin/chromium --version
          /tmp/solo-e2e-venv/bin/python -m pip show playwright
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          sha256sum tests/*.test.mjs tools/e2e/*.py > /tmp/solo-tests.sha256
          sha256sum js/*.js sw.js index.html manifest.webmanifest > /tmp/solo-source.sha256

      - name: Run every Node test file from the exact checkout
        run: |
          set -euo pipefail
          files=0
          failed=0
          for test in tests/*.test.mjs; do
            files=$((files + 1))
            echo "::group::$test"
            if node "$test"; then
              echo "PASS $test"
            else
              failed=$((failed + 1))
              echo "FAIL $test"
            fi
            echo '::endgroup::'
          done
          echo "RESULT files=$files passed=$((files - failed)) failed=$failed"
          test "$files" -gt 0
          test "$failed" -eq 0

      - name: Run browser suites with only isolated synthetic data
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -m http.server 8841 --bind 127.0.0.1 > /tmp/solo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://localhost:8841/index.html', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(0.5)
          PY
          failed=0
          suites=(secure_transfer record_notes customer_snapshot operation_history work_entry_safety work_productivity field_entry report_clarity integrity_audit ledger_links customer_fuel payment_agenda transaction_errors contract_extra_rates finance_integrity dump_cost_reliability historical_fuel bulk_entry_race driver_cash driver_group_share driver_share_recovery menu_routes part_cost part_document_guards redteam shared_dump attachment_safety redteam_finance financial_result_completeness operation_desk work_file assistant_task_center document_link deal_chain responsive_smoke workflow_release_guards assistant_agent assistant_workflow assistant_conversation cari_vat finance_audit79 assistant_audit80 assistant_turn assistant_customer assistant_customer_actions assistant_batch assistant_operations bulk_entry shared_dump_assistant command_dates command_selection assistant_files81 ticket_duplicate_key hakedis_preparation assistant_startup integrity_release84 ticket_atomic84 tank_atomic84 digital_slip_work dump_card_merge work_day_review integrity_review88 fleet_document_countdown maintenance_expense_history)
          for suite in "${suites[@]}"; do
            echo "::group::$suite browser suite"
            if /tmp/solo-e2e-venv/bin/python "tools/e2e/$suite.py" http://localhost:8841/; then
              echo "PASS $suite"
            else
              failed=$((failed + 1))
              echo "FAIL $suite"
            fi
            echo '::endgroup::'
          done
          echo "BROWSER RESULT suites=${#suites[@]} passed=$((${#suites[@]} - failed)) failed=$failed"
          test "$failed" -eq 0

      - name: Verify missing-price guards with real UI and IndexedDB
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -m http.server 8843 --bind 127.0.0.1 > /tmp/solo-price-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PYCODE'
          import time
          from urllib.request import urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://localhost:8843/index.html', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(0.5)
          PYCODE
          /tmp/solo-e2e-venv/bin/python tools/e2e/hakedis_price_probe.py http://localhost:8843/ --require-fixed

      - name: Check synchronized history assertions against the unchanged baseline
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          baseline=$(mktemp -d /tmp/solo-baseline-XXXXXX)
          git -c safe.directory="$GITHUB_WORKSPACE" archive 89ed872f1543f4240db8ea4e8e2fd4806e0d6422 | tar -x -C "$baseline"
          BASELINE_DIR="$baseline" python3 - <<'PYCODE'
          import ast, os
          from pathlib import Path
          old=Path(os.environ['BASELINE_DIR'],'tools/e2e/operation_history.py').read_text()
          new=Path('tools/e2e/operation_history.py').read_text()
          assertions=lambda source:[ast.dump(node,include_attributes=False) for node in ast.walk(ast.parse(source)) if isinstance(node,ast.Assert)]
          assert assertions(old)==assertions(new), 'Original operation history assertions must not change'
          print('All original operation-history assertions retained')
          PYCODE
          python3 -m http.server 8841 --bind 127.0.0.1 --directory "$baseline" > /tmp/solo-baseline-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$baseline"' EXIT
          python3 - <<'PYCODE'
          import time

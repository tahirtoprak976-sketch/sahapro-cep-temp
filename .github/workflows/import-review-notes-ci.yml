name: SOLO data preservation validation

# This isolated validation job cannot deploy or change repository content.
on:
  push:
    branches:
      - fix/v311-phone-json-publish
      - fix/v311-phone-test-errors
      - test/v311-phone-preview
      - feat/assistant-resilience-113
      - feat/assistant-mobile-112
      - feat/assistant-context-111
      - feat/assistant-hub-110
      - feat/assistant-workspace-109
      - fix/system-review-108
      - feat/executive-decisions-107
      - feat/mobile-finance-workspace-106
      - fix/optional-hakedis-vat-105
      - fix/offline-whatsapp-dates-104
      - fix/public-bootstrap-103
      - fix/assistant-data-rules-102
      - feat/assistant-question-box-101
      - feat/assistant-confidence-100
      - feat/assistant-gold-99
      - dot/import-review-notes
      - dot/solo-simplification
      - dot/solo-finance-audit
      - dot/solo-dump-accounting
      - codex/historical-fuel-review
      - fix/redteam-three-findings
      - fix/solo-workflow-76
      - fix/solo-cari-vat-78
      - fix/solo-finance-audit-79
      - fix/solo-assistant-audit-80
      - fix/solo-assistant-files-81
      - fix/solo-assistant-review-82
      - feat/solo-hakedis-preparation-83
      - fix/solo-integrity-84
      - fix/solo-digital-slip-work-85
      - fix/solo-dump-card-merge-86
      - feat/solo-work-day-review-87
      - fix/solo-integrity-review-88
      - feat/solo-fleet-document-countdown-89
      - fix/solo-maintenance-expense-link-90
      - fix/solo-parts-purchase-bridge-91
      - feat/solo-assistant-conversation-92
      - fix/solo-price-scope-93
      - fix/solo-task-capacity-94
      - fix/solo-price-application-finance-95
      - fix/solo-vehicle-price-type-96
      - fix/solo-vehicle-type-audit-97
      - fix/solo-assistant-large-batch-98

permissions:
  contents: read

concurrency:
  group: solo-data-preservation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact branch commit without saved credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Trust only the checked-out repository inside the test container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the normal Linux browser test runtime
        id: runtime
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends chromium python3-venv fonts-liberation fonts-dejavu-core
          python3 -m venv /tmp/solo-e2e-venv
          /tmp/solo-e2e-venv/bin/python -m pip install --disable-pip-version-check playwright==1.62.0 reportlab==4.4.9 pypdf==6.10.0 Pillow==12.3.0
          node --version
          /usr/bin/chromium --version
          /tmp/solo-e2e-venv/bin/python -m pip show playwright
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          sha256sum tests/*.test.mjs tools/e2e/*.py > /tmp/solo-tests.sha256
          sha256sum js/*.js sw.js index.html manifest.webmanifest > /tmp/solo-source.sha256

      - name: Run every Node test file from the exact checkout
        run: |
          set -euo pipefail
          files=0
          failed=0
          for test in tests/*.test.mjs; do
            files=$((files + 1))
            echo "::group::$test"
            echo "TEST $test" >> /tmp/solo-node-tests.log
            if node "$test" 2>&1 | tee -a /tmp/solo-node-tests.log; then
              echo "PASS $test"
            else
              failed=$((failed + 1))
              echo "FAIL $test"
            fi
            echo '::endgroup::'
          done
          echo "RESULT files=$files passed=$((files - failed)) failed=$failed"
          test "$files" -gt 0
          test "$failed" -eq 0

      - name: Retain complete Node diagnostics before browser validation
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solo-node-diagnostics-${{ github.sha }}
          path: /tmp/solo-node-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Reproduce finance safety failures with identical tests on unchanged live v3.9.98
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          node tests/assistant-gold/prove-baseline.mjs /tmp/solo-assistant99-baseline.json
          node tests/assistant-gold/run.mjs --report /tmp/solo-assistant99-candidate.json

      - name: Measure confidence filling against unchanged v3.9.99
        run: |
          node tests/assistant-gold/prove-confidence.mjs /tmp/solo-confidence100-measurement.json
          python3 tools/e2e/verify_confidence_test_assertions.py
          node tests/assistant-gold/run.mjs --confidence --report /tmp/solo-confidence100-expanded.json

      - name: Reproduce the mixed-photo regression on unchanged v99 and pre-fix PR sources
        run: |
          /tmp/solo-e2e-venv/bin/python tools/e2e/prove_confidence_photo.py

      - name: Verify installed v3.9.99 to confidence release preservation
        run: |
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_schema7.py --source-root . --baseline-ref 18e78cda6ecdfea6e149772c380037bbae8c6fba

      - name: Verify installed v3.10.00 to question-box release preservation
        run: |
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_schema7.py --source-root . --baseline-ref 59b571c71937ae46c70148cad1f72217c1d83c28

      - name: Verify briefly installed v3.10.01 to data-rules release preservation
        run: |
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_schema7.py --source-root . --baseline-ref 04aba45f298254622e3a754e53f5063314e21ac0

      - name: Verify installed v3.10.02 business records survive private bootstrap removal
        run: |
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_schema7.py --source-root . --baseline-ref 481d96489927abbbe6c88c890fc52a156f5744a2

      - name: Verify installed v3.10.03 to offline review preservation
        run: |
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_schema7.py --source-root . --baseline-ref a1854bc507ef386efb29a723c5fffb84abb58635

      - name: Verify installed v3.10.04 to optional VAT preservation
        run: |
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_schema7.py --source-root . --baseline-ref 42aaa42706ab23dcbb841c8d6807702557602aaf

      - name: Verify installed v3.10.12 to assistant resilience preservation
        run: |
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_schema7.py --source-root . --baseline-ref e7d801137388926b4aa6ecfafa4b6cc1f909f57f

      - name: Prove absent one-shot review on unchanged v3.10.12
        run: |
          set -euo pipefail
          baseline=$(mktemp -d /tmp/solo-resilience113-baseline-XXXXXX)
          git -c safe.directory="$GITHUB_WORKSPACE" archive e7d801137388926b4aa6ecfafa4b6cc1f909f57f | tar -x -C "$baseline"
          cp tests/assistant-resilience113.test.mjs "$baseline/tests/"
          if (cd "$baseline" && node tests/assistant-resilience113.test.mjs) > /tmp/solo-resilience113-baseline.log 2>&1; then
            echo 'Unchanged v112 unexpectedly provides the one-shot review'
            exit 1
          fi
          grep -F 'ERR_MODULE_NOT_FOUND' /tmp/solo-resilience113-baseline.log
          grep -F 'assistant-resilience.js' /tmp/solo-resilience113-baseline.log
          rm -rf "$baseline"

      - name: Verify installed v3.10.11 to mobile assistant preservation
        run: |
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_schema7.py --source-root . --baseline-ref 465a6e70254b5e3f79acc1b141e096bc37a62695

      - name: Prove absent card states on unchanged v3.10.11
        run: |

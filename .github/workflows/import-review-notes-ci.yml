          if /tmp/solo-e2e-venv/bin/python tools/e2e/operation_retry108.py http://localhost:8877/ > /tmp/solo-system108-baseline-operation.log 2>&1; then
            echo 'Unchanged v107 unexpectedly rejected changed operational requests'
            exit 1

            echo 'Unchanged v108 unexpectedly locks editing from first paint'
            exit 1
          fi
          grep -F 'Composer must be readonly from first paint' /tmp/solo-workspace109-readiness-baseline.log

      - name: Verify installed v3.10.07 to system-review preservation
        run: |
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_schema7.py --source-root . --baseline-ref dfe5341dbc27d463698027f4575c698a54722627

      - name: Reproduce cross-screen and financial request defects on unchanged v3.10.07
        run: |
          set -euo pipefail
          review_baseline=$(mktemp -d /tmp/solo-system108-baseline-XXXXXX)
          git -c safe.directory="$GITHUB_WORKSPACE" archive dfe5341dbc27d463698027f4575c698a54722627 | tar -x -C "$review_baseline"

name: SOLO data preservation validation

# This isolated validation job cannot deploy or change repository content.
on:
  push:
    branches:
      - dot/import-review-notes
      - dot/solo-simplification
      - dot/solo-finance-audit
      - dot/solo-dump-accounting

permissions:
  contents: read

concurrency:
  group: solo-data-preservation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact branch commit without saved credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the normal Linux browser test runtime
        id: runtime
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends chromium python3-venv fonts-liberation fonts-dejavu-core
          python3 -m venv /tmp/solo-e2e-venv
          /tmp/solo-e2e-venv/bin/python -m pip install --disable-pip-version-check playwright==1.62.0 reportlab==4.4.9
          node --version
          /usr/bin/chromium --version
          /tmp/solo-e2e-venv/bin/python -m pip show playwright
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          sha256sum tests/*.test.mjs tools/e2e/*.py > /tmp/solo-tests.sha256
          sha256sum js/*.js sw.js index.html manifest.webmanifest > /tmp/solo-source.sha256

      - name: Run every Node test file from the exact checkout
        run: |
          set -euo pipefail
          files=0
          failed=0
          for test in tests/*.test.mjs; do
            files=$((files + 1))
            echo "::group::$test"
            if node "$test"; then
              echo "PASS $test"
            else
              failed=$((failed + 1))
              echo "FAIL $test"
            fi
            echo '::endgroup::'
          done
          echo "RESULT files=$files passed=$((files - failed)) failed=$failed"
          test "$files" -gt 0
          test "$failed" -eq 0

      - name: Run browser suites with only isolated synthetic data
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -m http.server 8841 --bind 127.0.0.1 > /tmp/solo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://localhost:8841/index.html', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(0.5)
          PY
          failed=0
          suites=(secure_transfer record_notes customer_snapshot operation_history work_entry_safety work_productivity field_entry report_clarity integrity_audit ledger_links customer_fuel payment_agenda transaction_errors contract_extra_rates finance_integrity dump_cost_reliability)
          for suite in "${suites[@]}"; do
            echo "::group::$suite browser suite"
            if /tmp/solo-e2e-venv/bin/python "tools/e2e/$suite.py" http://localhost:8841/; then
              echo "PASS $suite"
            else
              failed=$((failed + 1))
              echo "FAIL $suite"
            fi
            echo '::endgroup::'
          done
          echo "BROWSER RESULT suites=${#suites[@]} passed=$((${#suites[@]} - failed)) failed=$failed"
          test "$failed" -eq 0

      - name: Verify missing-price guards with real UI and IndexedDB
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -m http.server 8843 --bind 127.0.0.1 > /tmp/solo-price-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PYCODE'
          import time
          from urllib.request import urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://localhost:8843/index.html', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(0.5)
          PYCODE
          /tmp/solo-e2e-venv/bin/python tools/e2e/hakedis_price_probe.py http://localhost:8843/ --require-fixed

      - name: Check synchronized history assertions against the unchanged baseline
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          baseline=$(mktemp -d /tmp/solo-baseline-XXXXXX)
          git -c safe.directory="$GITHUB_WORKSPACE" archive 89ed872f1543f4240db8ea4e8e2fd4806e0d6422 | tar -x -C "$baseline"
          BASELINE_DIR="$baseline" python3 - <<'PYCODE'
          import ast, os
          from pathlib import Path
          old=Path(os.environ['BASELINE_DIR'],'tools/e2e/operation_history.py').read_text()
          new=Path('tools/e2e/operation_history.py').read_text()
          assertions=lambda source:[ast.dump(node,include_attributes=False) for node in ast.walk(ast.parse(source)) if isinstance(node,ast.Assert)]
          assert assertions(old)==assertions(new), 'Original operation history assertions must not change'
          print('All original operation-history assertions retained')
          PYCODE
          python3 -m http.server 8841 --bind 127.0.0.1 --directory "$baseline" > /tmp/solo-baseline-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$baseline"' EXIT
          python3 - <<'PYCODE'
          import time
          from urllib.request import urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://localhost:8841/index.html', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(0.5)
          PYCODE
          /tmp/solo-e2e-venv/bin/python tools/e2e/operation_history.py

      - name: Verify real installed-baseline to release service-worker upgrade
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_review_notes.py --source-root . --baseline-ref 89ed872f1543f4240db8ea4e8e2fd4806e0d6422

      - name: Verify installed v3.9.70 to candidate upgrade preservation
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_review_notes.py --source-root . --baseline-ref 1098cf571c800f4f3109f00179adc5aa78efecc0

      - name: Verify installed v3.9.71 to candidate upgrade preservation
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_review_notes.py --source-root . --baseline-ref 32e42155bc58c7a52daa152f66acb04e2ae7f110

      - name: Verify installed v3.9.72 to dump-cost candidate upgrade preservation
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          /tmp/solo-e2e-venv/bin/python tools/e2e/upgrade_review_notes.py --source-root . --baseline-ref fbfb32c9ea3c6faffa439e210918f0384a167e41

      - name: Reproduce dump-cost defects on unchanged v3.9.72
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          baseline=$(mktemp -d /tmp/solo-dump-baseline-XXXXXX)
          git -c safe.directory="$GITHUB_WORKSPACE" archive fbfb32c9ea3c6faffa439e210918f0384a167e41 | tar -x -C "$baseline"
          cp tests/dump-cost-reliability.test.mjs "$baseline/tests/"
          BASELINE_PROOF=1 node "$baseline/tests/dump-cost-reliability.test.mjs"
          python3 -m http.server 8845 --bind 127.0.0.1 --directory "$baseline" > /tmp/solo-dump-baseline-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$baseline"' EXIT
          python3 - <<'PYCODE'
          import time
          from urllib.request import urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://localhost:8845/index.html', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(0.5)
          PYCODE
          /tmp/solo-e2e-venv/bin/python tools/e2e/dump_cost_reliability.py http://localhost:8845/ --baseline-proof

      - name: Reproduce finance and contract defects on unchanged v3.9.71
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          baseline=$(mktemp -d /tmp/solo-finance-baseline-XXXXXX)
          git -c safe.directory="$GITHUB_WORKSPACE" archive 32e42155bc58c7a52daa152f66acb04e2ae7f110 | tar -x -C "$baseline"
          python3 -m http.server 8844 --bind 127.0.0.1 --directory "$baseline" > /tmp/solo-finance-baseline-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$baseline"' EXIT
          python3 - <<'PYCODE'
          import time
          from urllib.request import urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://localhost:8844/index.html', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(0.5)
          PYCODE
          echo 'BASELINE ONLY: these runs demonstrate the old defects, never candidate correctness.'
          /tmp/solo-e2e-venv/bin/python tools/e2e/finance_integrity.py http://localhost:8844/ --baseline-proof
          /tmp/solo-e2e-venv/bin/python tools/e2e/contract_extra_rates.py http://localhost:8844/ --baseline-proof

      - name: Reproduce old draft collision and diagnose missing-price risk on unchanged v3.9.70 only
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          baseline=$(mktemp -d /tmp/solo-clarity-baseline-XXXXXX)
          git -c safe.directory="$GITHUB_WORKSPACE" archive 1098cf571c800f4f3109f00179adc5aa78efecc0 | tar -x -C "$baseline"
          python3 -m http.server 8842 --bind 127.0.0.1 --directory "$baseline" > /tmp/solo-clarity-baseline-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$baseline"' EXIT
          python3 - <<'PYCODE'
          import time
          from urllib.request import urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://localhost:8842/index.html', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(0.5)
          PYCODE
          echo 'BASELINE ONLY: successful reproduction proves the old defect, not candidate correctness.'
          /tmp/solo-e2e-venv/bin/python tools/e2e/work_entry_safety.py http://localhost:8842/ --baseline-proof
          /tmp/solo-e2e-venv/bin/python tools/e2e/hakedis_price_probe.py http://localhost:8842/

      - name: Verify the test files stayed unchanged
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          sha256sum --check /tmp/solo-tests.sha256
          sha256sum --check /tmp/solo-source.sha256
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- tests tools/e2e

      - name: Retain synthetic visual evidence for review
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, official tag verified
        with:
          name: solo-synthetic-visual-evidence-${{ github.sha }}
          path: |
            /tmp/solo-report-clarity/*.png
            /tmp/solo-report-clarity/*.pdf
            /tmp/solo-report-clarity/*.csv
            /tmp/solo-work-entry/*.png
            /tmp/solo-finance-integrity/*
            /tmp/solo-dump-cost-reliability/*
            /tmp/solo-contract-extra-rates/*
            /tmp/solo-source.sha256
            /tmp/solo-tests.sha256
          if-no-files-found: warn
          retention-days: 3

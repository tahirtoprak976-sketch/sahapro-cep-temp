          trap 'rm -rf "$private_baseline"' EXIT
          git -c safe.directory="$GITHUB_WORKSPACE" archive 481d96489927abbbe6c88c890fc52a156f5744a2 | tar -x -C "$private_baseline"
          python3 - "$private_baseline" <<'PYASSERT'

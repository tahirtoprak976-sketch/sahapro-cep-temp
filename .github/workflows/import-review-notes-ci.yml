          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$review_baseline"' EXIT
          python3 - <<'PYREADY'
          import time
          from urllib.request import urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://localhost:8877/index.html',timeout=1) as response:
                      assert response.status==200
                  break
              except OSError:
                  if attempt==59:raise
                  time.sleep(.2)
          PYREADY
          for scenario in dirty labels modal uri money menu source profit; do
            if /tmp/solo-e2e-venv/bin/python tools/e2e/system_review108.py http://localhost:8877/ --case "$scenario" > "/tmp/solo-system108-baseline-$scenario.log" 2>&1; then
              echo "Unchanged v107 unexpectedly passed $scenario"
              exit 1
            fi
          done
          grep -F 'Edited settings after navigation must block an unconfirmed update' /tmp/solo-system108-baseline-dirty.log
          grep -F 'Visible form label must be associated' /tmp/solo-system108-baseline-labels.log
          grep -F 'An open input dialog must block update' /tmp/solo-system108-baseline-modal.log
          grep -F 'Malformed encoded routes must show a recoverable error' /tmp/solo-system108-baseline-uri.log
          grep -F 'Unknown staff cash must not be displayed as zero money' /tmp/solo-system108-baseline-money.log
          grep -F 'More must show the actual running version' /tmp/solo-system108-baseline-menu.log
          grep -F 'Original source must remain verbatim' /tmp/solo-system108-baseline-source.log
          grep -F 'Unverified claim source must suppress numeric profit' /tmp/solo-system108-baseline-profit.log
          if /tmp/solo-e2e-venv/bin/python tools/e2e/enterprise_retry108.py http://localhost:8877/ > /tmp/solo-system108-baseline-retry.log 2>&1; then
            echo 'Unchanged v107 unexpectedly rejected changed financial requests'
            exit 1
